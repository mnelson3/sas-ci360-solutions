[metadata]
name = sasci360solutions
version = 0.0.1
author = Nelson Grey LLC
author_email = support@nelsongrey.com
description = Automation engine for SAS Customer Intelligence 360 operations
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/mnelson3/sas-ci360-solutions
project_urls = Bug Tracker = https://github.com/mnelson3/sas-ci360-solutions/issues
classifiers = Programming Language :: Python :: 3
              License :: Other/Proprietary License
              Operating System :: OS Independent

[install_requires]
package = cryptography
          matplotlib
          numpy
          packaging
          pandas
          PyJWT
          python-daemon
          python-dateutil
          query-string
          requests
          rsa
          sas-dlpy
          sas-esppy
          SAS-kernel
          saspy
          schedule
          urllib3

[options]
package_dir = = src
packages = find:
python_requires = >=3.8

[options.packages.find]
where = src
