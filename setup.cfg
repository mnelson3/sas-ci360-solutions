[metadata]
name = sasci360solutions
version = 0.0.1
author = Nelson Grey LLC
author_email = support@nelsongrey.com
description = Automation engine for SAS Customer Intelligence 360 operations
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/mnelson3/sas-ci360-solutions
project_urls = Bug Tracker = https://github.com/mnelson3/sas-ci360-solutions/issues
classifiers = Programming Language :: Python :: 3
              License :: Other/Proprietary License
              Operating System :: OS Independent

[options]
package_dir = = src
packages = find:
python_requires = >=3.8
install_requires =
	pandas>=2.0.0
	PyJWT>=2.0.0
	python-daemon
	python-dateutil
	requests>=2.24.0
	saspy>=5.0.0
	schedule
	sasci360apicore
	sasci360soldata

[options.packages.find]
where = src
